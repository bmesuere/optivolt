name: Optivolt
slug: optivolt
version: "0.2.0"
description: Plan and control Victron ESS with forecasts & dynamic tariffs!
url: https://github.com/bmesuere/optivolt
arch:
  - aarch64
  - amd64
init: false

# Ingress lets the UI appear inside Home Assistant without opening a port.
ingress: true
ingress_port: 3000
panel_title: Optivolt
panel_icon: mdi:home-battery-outline
homeassistant_api: true

ports:
  "3000/tcp": 3070
ports_description:
  "3000/tcp": Direct API access (use ingress for UI)

# /data is always mapped and writable for every add-on automatically;
# no explicit `map` entry is needed (and the add-on linter rejects "data"
# as a `map` value in its string form).

options:
  site_id: ""
  vrm_token: ""
  mqtt_host: "venus.local"
  mqtt_port: 0            # 0 = auto: 8883 with TLS, 1883 without
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_tls_verify: true
  mqtt_tls_ca: ""
  mqtt_tls_fingerprint: ""

schema:
  site_id: str
  vrm_token: password
  mqtt_host: str
  mqtt_port: int(0,)
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  mqtt_tls_verify: bool
  mqtt_tls_ca: str
  mqtt_tls_fingerprint: str
