name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run typecheck
      run: npm run typecheck

    - name: Run tests with coverage
      run: npm run test:coverage

  docker-smoke:
    name: Docker build & health smoke test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # ubuntu-latest runners are amd64, matching the Dockerfile's pinned
    # default-base stage (the HA builder overrides BUILD_FROM per arch).
    - name: Build image
      run: docker build -t optivolt-smoke:ci .

    - name: Start container
      run: docker run -d --name optivolt-smoke -p 3000:3000 optivolt-smoke:ci

    - name: Wait for /health
      run: |
        for i in $(seq 1 30); do
          if curl -fs http://127.0.0.1:3000/health; then
            echo
            echo "Server is up and healthy."
            exit 0
          fi
          sleep 2
        done
        echo "::error::Container never became healthy within 60s"
        exit 1

    - name: Dump container logs on failure
      if: failure()
      run: docker logs optivolt-smoke

    - name: Stop container
      if: always()
      run: docker rm -f optivolt-smoke

  addon-lint:
    name: Home Assistant add-on lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # frenck/action-addon-linter was renamed upstream to
    # frenck/action-app-linter (Home Assistant "add-ons" -> "apps"); it
    # still lints the legacy config.yaml/build.yaml format we use.
    - name: Run Home Assistant add-on linter
      uses: frenck/action-app-linter@v2
      with:
        path: "./"
